<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaggasignal — Nepal land search</title>
<meta name="description" content="Search Nepal land listings with unit-safe prices, comparables and cited, factor-by-factor analysis. Screening tool, not advice.">
<meta name="color-scheme" content="dark">
<link rel="preload" href="fonts/orbitron-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#results">Skip to results</a>
<div class="fx-sun" aria-hidden="true"></div>
<div class="fx-scan" aria-hidden="true"></div>

<header class="top" role="banner">
  <div class="grid-floor" aria-hidden="true"></div>
  <div class="top-row">
    <a class="brand" href="#" aria-label="Jaggasignal home"><span class="brand-mark">JAGGA</span><span class="brand-sub">SIGNAL</span></a>
    <form class="search" role="search" id="searchForm" autocomplete="off">
      <label class="sr" for="q">Search by place or keyword</label>
      <span class="prompt" aria-hidden="true">&gt;</span>
      <input id="q" type="search" placeholder="chabahil, dahachowk, 10 aana…" spellcheck="false">
    </form>
    <nav class="top-actions" aria-label="Site">
      <button class="btn btn-ghost" id="btnCompare" type="button" aria-label="Compare selected listings"><span>⇄ Compare <b id="cmpCount">0</b></span></button>
      <button class="btn btn-ghost" id="btnWatch" type="button"><span>★ Watchlist <b id="watchCount">0</b></span></button>
      <button class="btn btn-ghost" id="btnCoverage" type="button"><span>Coverage</span></button>
      <button class="btn btn-ghost" id="btnAbout" type="button"><span>About</span></button>
      <button class="btn btn-ghost" id="btnLang" type="button" lang="ne" aria-pressed="false" aria-label="Language"><span>नेपाली</span></button>
    </nav>
  </div>
  <div class="filters" role="group" aria-label="Filters">
    <label class="chip"><span class="sr">District</span>
      <select id="fDis"><option value="">All districts</option></select></label>
    <label class="chip"><span class="sr">Price unit</span>
      <select id="fUnit" title="Price shown and filtered per…">
        <option value="aana">per aana</option><option value="ropani">per ropani</option><option value="kattha">per kattha</option>
        <option value="dhur">per dhur</option><option value="bigha">per bigha</option><option value="sqft">per sq ft</option><option value="sqm">per m²</option>
      </select></label>
    <span class="chip range"><span class="lbl">Price</span>
      <input id="fPmin" inputmode="numeric" aria-label="Minimum price per unit in rupees" placeholder="min Rs">
      <span aria-hidden="true">–</span>
      <input id="fPmax" inputmode="numeric" aria-label="Maximum price per unit in rupees" placeholder="max Rs"></span>
    <span class="chip range"><span class="lbl">Area</span>
      <input id="fAmin" inputmode="decimal" aria-label="Minimum area" placeholder="min">
      <span aria-hidden="true">–</span>
      <input id="fAmax" inputmode="decimal" aria-label="Maximum area" placeholder="max">
      <select id="fAunit" aria-label="Area unit"><option value="aana">aana</option><option value="ropani">ropani</option><option value="kattha">kattha</option><option value="dhur">dhur</option><option value="bigha">bigha</option><option value="sqm">m²</option></select></span>
    <label class="chip"><span class="lbl">Road ≥</span><input id="fRoad" inputmode="numeric" aria-label="Minimum road width in feet" placeholder="ft"></label>
    <label class="chip"><span class="sr">Source</span><select id="fSrc"><option value="">All sources</option></select></label>
    <label class="chip" title="By the date the portal gives the ad. Ads with no posted date are hidden when this is set."><span class="lbl">Posted</span>
      <select id="fAge" aria-label="How recently the ad was posted"><option value="">any time</option><option value="7">last 7 days</option><option value="30">last 30 days</option><option value="90">last 3 months</option><option value="180">last 6 months</option></select></label>
    <label class="chip check"><input id="fCut" type="checkbox"><span>Price cut</span></label>
    <label class="chip check" title="The same plot is often posted several times"><input id="fDups" type="checkbox"><span>Show duplicates</span></label>
    <label class="chip"><span class="sr">Saved searches</span><select id="savedSel"><option value="">Saved searches…</option></select></label>
    <button class="btn btn-ghost" id="btnSave" type="button"><span>Save search</span></button>
    <button class="btn btn-ghost" id="btnReset" type="button"><span>Reset</span></button>
  </div>
</header>

<main class="split" id="main">
  <section class="list-pane" aria-labelledby="resultsHead">
    <div class="list-head">
      <h1 id="resultsHead" class="count" aria-live="polite">— listings</h1>
      <div class="list-tools">
        <label class="chip"><span class="lbl">Sort</span>
          <select id="fSort" aria-label="Sort order">
            <option value="price">Price: low to high</option><option value="-price">Price: high to low</option>
            <option value="value">Cheapest vs comps</option><option value="total">Total price</option>
            <option value="-area">Largest area</option><option value="new">Newest</option>
          </select></label>
        <label class="chip check" title="Only list what is inside the map view"><input id="fMapOnly" type="checkbox"><span>Search map area</span></label>
        <details class="export"><summary class="btn btn-ghost"><span>Export</span></summary>
          <div class="menu"><button type="button" data-export="csv">CSV</button><button type="button" data-export="geojson">GeoJSON</button><button type="button" data-export="kml">KML</button></div>
        </details>
      </div>
    </div>
    <figure class="hist" id="hist" hidden><svg id="histSvg" role="img" aria-label="Price distribution" viewBox="0 0 400 64" preserveAspectRatio="none"></svg>
      <figcaption id="histCap" class="foot"></figcaption></figure>
    <ol id="results" class="cards" tabindex="-1"></ol>
    <div class="more"><button class="btn btn-outline" id="btnMore" type="button" hidden><span>Show more</span></button></div>
    <footer class="foot" id="foot"></footer>
  </section>

  <section class="map-pane" aria-label="Map of listings">
    <div id="map" role="application" aria-label="Interactive map. Use the list for keyboard access to every listing."></div>
    <div class="layers" role="group" aria-label="Map layers">
      <label class="chip check"><input id="lyL" type="checkbox" checked><span>Listings</span></label>
      <label class="chip check"><input id="lyC" type="checkbox"><span>Infrastructure</span></label>
      <label class="chip check"><input id="lyB" type="checkbox"><span>Districts &amp; coverage</span></label>
    </div>
    <div class="legend" aria-hidden="false"><span class="sw sw-cheap"></span> cheap vs comps <span class="sw sw-mid"></span> mid <span class="sw sw-dear"></span> dear <span class="sw sw-none"></span> no comps</div>
  </section>
</main>

<nav class="tabbar" aria-label="View">
  <button class="btn btn-outline on" id="tabList" type="button"><span>List</span></button>
  <button class="btn btn-outline" id="tabMap" type="button"><span>Map</span></button>
</nav>

<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="dTitle" hidden>
  <div class="win-bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="win-title">&gt; listing.xray</span>
    <button class="x" id="dClose" type="button" aria-label="Close details">✕</button></div>
  <div class="drawer-body" id="dBody"></div>
</aside>

<dialog class="modal" id="modal"><div class="win-bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="win-title" id="mTitle"></span>
  <button class="x" id="mClose" type="button" aria-label="Close">✕</button></div><div class="modal-body" id="mBody"></div></dialog>

<script src="data.js"></script>
<script src="lib.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
<script src="i18n.js"></script>
</body>
</html>
